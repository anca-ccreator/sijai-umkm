[phases.setup]
nixPkgs = ['php82', 'php82Packages.composer']

[phases.install]
cmds = ['composer install --no-dev --optimize-autoloader --no-interaction']

[start]
cmd = 'php artisan config:clear && php artisan route:clear && php artisan view:clear && php artisan sijai:init-db && php artisan serve --host 0.0.0.0 --port $PORT'
